<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuevo producto — Veterinaria San Marcos</title>
<link rel="icon" type="image/png" href="../img/Logo_SanMarcos.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div id="site-header"></div>
<div class="admin-layout">
  <nav class="admin-menu">
    <a href="index.html">Inicio</a>
    <a href="productos.html" class="activo">Productos</a>
    <a href="usuarios.html">Usuarios</a>
  </nav>
  <div class="admin-contenido">
    <h1 id="tituloFormulario">Nuevo producto</h1>
    <form class="formulario" id="formProducto" novalidate style="margin:0;">
      <input type="hidden" id="idProducto">
      <div class="campo">
        <label for="codigo">Código de producto</label>
        <input type="text" id="codigo" minlength="3">
        <span class="mensaje-error" id="error-codigo"></span>
      </div>
      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" maxlength="100">
        <span class="mensaje-error" id="error-nombre"></span>
      </div>
      <div class="campo">
        <label for="descripcion">Descripción (opcional)</label>
        <textarea id="descripcion" rows="3" maxlength="500"></textarea>
        <span class="mensaje-error" id="error-descripcion"></span>
      </div>
      <div class="campo">
        <label for="precio">Precio (CLP)</label>
        <input type="number" id="precio" min="0" step="1">
        <span class="mensaje-error" id="error-precio"></span>
      </div>
      <div class="campo">
        <label for="stock">Stock</label>
        <input type="number" id="stock" min="0" step="1">
        <span class="mensaje-error" id="error-stock"></span>
      </div>
      <div class="campo">
        <label for="stockCritico">Stock crítico (opcional)</label>
        <input type="number" id="stockCritico" min="0" step="1">
        <span class="mensaje-error" id="error-stockCritico"></span>
      </div>
      <div class="campo">
        <label for="categoria">Categoría</label>
        <select id="categoria">
          <option value="">Seleccione categoría</option>
          <option>Alimento</option>
          <option>Accesorios</option>
          <option>Higiene</option>
          <option>Salud</option>
          <option>Juguetes</option>
        </select>
        <span class="mensaje-error" id="error-categoria"></span>
      </div>
      <div class="campo">
        <label for="imagen">Imagen (opcional)</label>
        <input type="file" id="imagen" accept="image/*">
      </div>
      <button type="submit">Guardar producto</button>
    </form>
  </div>
</div>
<div id="site-footer"></div>
<script src="../js/carrito.js"></script>
<script src="../js/productos-data.js"></script>
<script src="../js/productos.js"></script>
<script src="../js/componentes.js"></script>
<script src="../js/validaciones.js"></script>
<script src="../js/admin.js"></script>
<script>
  initLayout("home", "../");
  cargarFormularioProducto();
  document.getElementById("formProducto").addEventListener("submit", guardarFormularioProducto);
</script>
</body>
</html>
